[project]
name = "rag-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Mazumder", email = "abhishek.am988@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-search-documents>=12.0.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
rag-core = "rag_core:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
